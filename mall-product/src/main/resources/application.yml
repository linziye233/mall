server:
  port: 8866
spring:
  application:
    name: mall-product
  profiles:
    active: dev
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  config:
    import:
      - optional:nacos:tulingmall-nacos.yml
      - optional:nacos:tulingmall-db-common.yml
  datasource:
    url: jdbc:mysql://localhost:3306/mall?serverTimezone=UTC&useSSL=false&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: 123456
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: druid
        login-password: druid
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yml

# ZooKeeper 配置（开发阶段使用本地默认值）
zk:
  curator:
    connectUrl: ${ZK_CONNECT_URL:localhost:2181}
    retryCount: ${ZK_RETRY_COUNT:3}
    elapsedTimeMs: ${ZK_ELAPSED_TIME_MS:1000}
    sessionTimeOutMs: ${ZK_SESSION_TIMEOUT_MS:60000}
    connectionTimeOutMs: ${ZK_CONNECTION_TIMEOUT_MS:15000}

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml
management: #开启SpringBoot Admin的监控
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
